name: CI

on:
  push:
    branches: [main]   # change branches are checked when they reach main or a pull request
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_private.py --all

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_changelog.py "origin/${{ github.base_ref }}"

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux and Windows (the owner's system), oldest and newest supported Python.
      # macOS was dropped: GitHub often had no macOS runner free and cancelled the jobs.
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Browser for the panel tests (Linux only; skipped elsewhere)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: pytest
