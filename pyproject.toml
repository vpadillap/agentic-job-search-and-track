[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobtracker"
version = "0.1.0"
description = "Local-first job search assistant driven by an AI agent"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
jobtracker = "jobtracker.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
