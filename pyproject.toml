[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobtracker"
version = "0.1.0"
description = "Local-first job search assistant driven by an AI agent"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "pypdf>=4",
    "python-docx>=1.1",
    "docx2pdf>=0.1.8; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "playwright>=1.45",
]

[project.scripts]
jobtracker = "jobtracker.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: drives the panel in a real browser (needs `python -m playwright install chromium`)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
